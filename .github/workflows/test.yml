name: CRM checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check app.js
      - run: node crm-check.cjs
      - run: node --check company-import.js
      - run: node import-check.cjs
      - run: node relationship-check.cjs
      - run: node sales-check.cjs
      - run: node resource-check.cjs
      - run: node unscheduled-check.cjs
